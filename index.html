<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор производственных навесок</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101827;color:#f1f5f9;font:16px system-ui,sans-serif;padding:24px}
    main{max-width:560px;margin:40px auto;background:#1e293b;border-radius:18px;padding:28px}
    h1{font-size:25px;margin-top:0}p{color:#cbd5e1}label{display:block;margin:20px 0 7px}
    input{width:100%;padding:13px;border:1px solid #64748b;border-radius:9px;background:#0f172a;color:white;font:inherit}
    button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:#38bdf8;color:#082f49;font:inherit;font-weight:700}
    output{display:block;margin-top:24px;padding:18px;background:#0f172a;border-radius:10px;font-size:24px;font-weight:700}
    small{display:block;color:#94a3b8;margin-top:15px}
  </style>
</head>
<body>
  <main>
    <h1>Калькулятор навесок</h1>
    <p>Рассчитай массу компонента по массе партии и проценту в рецептуре.</p>
    <form id="calc">
      <label for="mass">Масса партии, кг</label>
      <input id="mass" type="number" min="0.001" step="any" value="20" required>
      <label for="percent">Доля компонента, %</label>
      <input id="percent" type="number" min="0" max="100" step="any" value="5" required>
      <button type="submit">Рассчитать</button>
    </form>
    <output id="result" aria-live="polite">Навеска: 1 000 г</output>
    <small>Расчёт: масса партии × процент / 100. Результат в граммах.</small>
  </main>
  <script>
    const form = document.getElementById('calc');
    const result = document.getElementById('result');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const mass = Number(document.getElementById('mass').value);
      const percent = Number(document.getElementById('percent').value);
      if (!Number.isFinite(mass) || mass <= 0 || !Number.isFinite(percent) || percent < 0 || percent > 100) {
        result.textContent = 'Проверь массу и процент (от 0 до 100).';
        return;
      }
      const grams = mass * percent * 10;
      result.textContent = 'Навеска: ' + new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 3}).format(grams) + ' г';
    });
  </script>
</body>
</html>
